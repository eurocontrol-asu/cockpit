site_name: Cockpit
site_description: Control layer for ContrailNet data pipelines
site_url: https://eurocontrol-asu.github.io/cockpit
repo_url: https://github.com/eurocontrol-asu/cockpit

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Architecture: architecture.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
